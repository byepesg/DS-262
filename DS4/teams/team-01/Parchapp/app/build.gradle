plugins {
    id 'com.android.application' version '8.10.1'
}

android {
    namespace 'com.parchapp.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.parchapp'
        // Android 8.0: desde ahí existe java.time (fechas de los parches) sin configuración extra
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.1'
    }

    // Firma con los tres esquemas. Con minSdk 26, Gradle omite la v1 (JAR) por defecto,
    // pero el instalador de Xiaomi/HyperOS revisa el APK con su propio analizador y falla
    // ("error durante el análisis del paquete") cuando no la encuentra.
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Toda la lógica (estructuras propias, reglas de parches, servicios) viene de core
    implementation project(':core')

    // Solo componentes de interfaz. Ninguna es una librería de estructuras de datos.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
